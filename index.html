<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🧽 海綿寶寶梗圖猜謎 🍔</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }

  :root{
    --yellow:#FFF176;
    --pink:#FF8A80;
    --aqua:#80DEEA;
    --ink:#0E4C5C;
    --ink-soft:#4E7C88;
    --shadow:0 5px 0 var(--ink);
  }

  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0; min-height:100vh; color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background-color:#DFF6FA;
    background-image:
      radial-gradient(circle, rgba(255,241,118,.85) 9px, transparent 10px),
      radial-gradient(circle, rgba(255,138,128,.42) 6px, transparent 7px),
      radial-gradient(circle, rgba(128,222,234,.60) 11px, transparent 12px);
    background-size:150px 150px, 110px 110px, 190px 190px;
    background-position:0 0, 60px 80px, 100px 40px;
    padding:16px 14px 70px;
  }

  .app{ max-width:820px; margin:0 auto; }
  .topbar{ text-align:center; margin:6px 0 16px; }
  .topbar h1{ margin:0 0 6px; font-size:clamp(1.35rem, 5vw, 2.1rem); color:var(--ink); text-shadow:2px 2px 0 #fff, 5px 5px 0 rgba(255,138,128,.55); }
  .topbar .sub{ margin:0; font-size:.85rem; font-weight:700; color:var(--ink-soft); }

  .tabs{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:18px; }
  .tab{ font-family:inherit; font-size:.95rem; font-weight:900; color:var(--ink); background:#fff; border:3px solid var(--ink); border-radius:999px; padding:10px 22px; cursor:pointer; box-shadow:var(--shadow); transition:background .15s, transform .08s, box-shadow .08s; }
  .tab.active{ background:var(--yellow); }
  .tab:active{ transform:translateY(4px); box-shadow:0 1px 0 var(--ink); }

  .view{ display:none; }
  .view.active{ display:block; animation:fade .25s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

  .hud{ display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .hud-item{ flex:1 1 90px; background:#fff; border:3px solid var(--ink); border-radius:16px; padding:8px 10px; text-align:center; box-shadow:0 4px 0 var(--ink); }
  .hud-label{ display:block; font-size:.68rem; font-weight:800; letter-spacing:.08em; color:var(--ink-soft); }
  .hud-value{ display:block; font-size:1.15rem; font-weight:900; line-height:1.3; }

  .image-card{ background:#E1F5FE; border:3px solid var(--ink); border-radius:22px; padding:10px; margin-bottom:14px; display:flex; justify-content:center; box-shadow:0 6px 0 var(--ink); }
  #quizImage{ display:block; width:100%; max-width:400px; height:auto; border-radius:14px; background:#fff; border:2px dashed rgba(14,76,92,.25); }

  .hint-row{ margin-bottom:14px; }
  .hint-text{ display:none; margin:10px 0 0; padding:12px 14px; font-weight:800; font-size:.9rem; background:#FFFDE7; border:3px dashed #E8D24B; border-radius:14px; color:#7A6A00; }
  .hint-text.show{ display:block; animation:fade .2s ease; }

  .answer-row{ display:flex; gap:10px; flex-wrap:wrap; }
  #answerInput{ flex:1 1 180px; min-width:0; padding:14px 16px; font-size:1rem; font-weight:800; color:var(--ink); font-family:inherit; border-radius:14px; border:3px solid var(--ink); background:#fff; }
  #answerInput:focus{ outline:none; box-shadow:0 0 0 5px rgba(128,222,234,.75); }
  #answerInput:disabled{ background:#ECEFF1; color:#78909C; }

  .btn{ font-family:inherit; font-size:.95rem; font-weight:900; color:var(--ink); background:#fff; border:3px solid var(--ink); border-radius:14px; padding:12px 20px; cursor:pointer; box-shadow:0 4px 0 var(--ink); transition:transform .08s, box-shadow .08s, background .15s; }
  .btn:active{ transform:translateY(4px); box-shadow:0 0 0 var(--ink); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; transform:none; box-shadow:0 4px 0 var(--ink); }
  .btn.primary{ background:var(--yellow); }
  .btn.aqua{ background:var(--aqua); }
  .btn.danger{ background:#FFCDD2; }
  .btn.full{ width:100%; margin-top:14px; }
  .btn.small{ padding:8px 13px; font-size:.85rem; border-radius:12px; box-shadow:0 3px 0 var(--ink); }

  .feedback{ display:none; margin-top:14px; border-radius:16px; padding:14px 16px; border:3px solid; }
  .feedback.show{ display:block; animation:pop .25s ease; }
  .feedback.ok{ background:#E8F5E9; border-color:#2E7D32; }
  .feedback.no{ background:#FFEBEE; border-color:#C62828; }
  @keyframes pop{ from{ transform:scale(.96); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .fb-head{ font-size:1.05rem; font-weight:900; margin-bottom:8px; }
  .feedback.ok .fb-head{ color:#2E7D32; }
  .feedback.no .fb-head{ color:#C62828; }
  .fb-line{ font-size:.9rem; font-weight:700; margin:6px 0; line-height:1.6; }
  .fb-line .tag{ display:inline-block; font-size:.7rem; font-weight:900; padding:2px 8px; margin-right:6px; background:rgba(14,76,92,.12); border-radius:999px; vertical-align:middle; }

  .result-card{ background:#fff; border:3px solid var(--ink); border-radius:24px; padding:26px 20px; text-align:center; box-shadow:0 6px 0 var(--ink); }
  .result-title{ margin:0 0 10px; font-size:1.3rem; }
  .result-score{ font-size:3rem; font-weight:900; line-height:1; color:#E53935; text-shadow:2px 2px 0 #FFCDD2; }
  .result-score span{ font-size:1.05rem; margin-left:4px; color:var(--ink-soft); text-shadow:none; }
  .result-line{ margin:14px 0 6px; font-weight:800; color:var(--ink-soft); }
  .result-comment{ margin:0 0 20px; font-weight:900; font-size:1.02rem; }
  .result-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

  .empty-state{ background:#fff; border:3px solid var(--ink); border-radius:22px; padding:30px 20px; text-align:center; box-shadow:0 6px 0 var(--ink); }
  .empty-state p{ font-weight:800; margin:0 0 16px; color:var(--ink-soft); }

  .toolbar{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .q-list{ display:flex; flex-direction:column; gap:12px; }
  .q-item{ display:flex; gap:12px; align-items:center; background:#fff; border:3px solid var(--ink); border-radius:18px; padding:10px; box-shadow:0 4px 0 var(--ink); }
  .q-item img{ width:64px; height:64px; flex:0 0 auto; object-fit:contain; border-radius:12px; background:#E1F5FE; }
  .q-info{ flex:1 1 auto; min-width:0; }
  .q-idx{ font-size:.68rem; font-weight:900; color:#8FAEB8; }
  .q-ans{ font-weight:900; font-size:.95rem; }
  .q-hint{ font-size:.74rem; color:var(--ink-soft); }
  .q-actions{ display:flex; gap:8px; }

  .modal-backdrop{ position:fixed; inset:0; z-index:100; padding:16px; background:rgba(10,50,60,.55); display:flex; align-items:center; justify-content:center; }
  .modal{ width:min(560px, 100%); max-height:90vh; overflow:auto; background:#fff; border:3px solid var(--ink); border-radius:24px; }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px; background:var(--yellow); border-bottom:3px solid var(--ink); border-radius:21px 21px 0 0; }
  .modal-body{ padding:16px 18px; display:flex; flex-direction:column; gap:14px; }
  .field{ display:flex; flex-direction:column; gap:7px; }
  .field-label{ font-size:.8rem; font-weight:900; color:#2E6B7A; }
  .field input[type=text], .field input[type=url], .field textarea{ font-family:inherit; font-size:.92rem; font-weight:700; color:var(--ink); padding:11px 13px; border-radius:12px; border:2.5px solid rgba(14,76,92,.45); background:#F7FEFF; }
  .field input[type=file]{ font-size:.8rem; padding:9px; border-radius:12px; border:2.5px dashed rgba(14,76,92,.45); background:#F7FEFF; }
  .preview-box{ width:100%; height:172px; border-radius:14px; overflow:hidden; border:2.5px dashed rgba(14,76,92,.35); background:#E1F5FE; display:flex; align-items:center; justify-content:center; }
  .preview-box img{ max-width:100%; max-height:100%; object-fit:contain; }
  #previewPlaceholder{ color:#8FAEB8; font-size:.82rem; font-weight:800; }
  .modal-foot{ display:flex; gap:10px; justify-content:flex-end; padding:14px 18px; border-top:3px solid rgba(14,76,92,.14); }
  .icon-btn{ border:none; background:transparent; font-size:1.1rem; font-weight:900; color:var(--ink); cursor:pointer; padding:4px 9px; border-radius:9px; }

  .toast{ position:fixed; left:50%; bottom:26px; z-index:300; transform:translateX(-50%) translateY(16px); background:var(--ink); color:#fff; font-weight:900; font-size:.88rem; padding:12px 22px; border-radius:999px; max-width:90vw; text-align:center; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .timer-bar{ margin: 10px 0; text-align: center; font-size: 1.6rem; font-weight: 900; color: #E53935; }
  .timer-bar span { font-size: 0.9rem; color: var(--ink-soft); }

  .battle-status { text-align: center; margin: 10px 0; font-weight: 900; color: #4E7C88; }
  .battle-scores { display: flex; justify-content: space-around; margin-bottom: 10px; }
  .battle-score-box { background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 8px 16px; text-align: center; }
  .battle-score-box .name { font-size: 0.8rem; color: var(--ink-soft); font-weight: 800; }
  .battle-score-box .score { font-size: 1.8rem; font-weight: 900; color: #E53935; }

  @media (max-width:480px){
    body{ padding:12px 10px 60px; }
    .btn{ padding:11px 16px; font-size:.9rem; }
    .preview-box{ height:140px; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <h1>🧽 海綿寶寶梗圖猜謎 🍔</h1>
    <p class="sub">看圖打字回答，考驗你的比奇堡知識！</p>
  </header>

  <nav class="tabs">
    <button class="tab active" data-view="game" type="button">🎮 單人遊戲</button>
    <button class="tab" data-view="manage" type="button">🛠 管理題庫</button>
    <button class="tab" data-view="multiplayer" type="button">👥 多人對戰</button>
  </nav>

  <main>
    <!-- ============ 單人遊戲 ============ -->
    <section id="view-game" class="view active">
      <div id="gamePlay">
        <div class="hud">
          <div class="hud-item"><span class="hud-label">分數</span><span class="hud-value" id="score">0</span></div>
          <div class="hud-item"><span class="hud-label">進度</span><span class="hud-value" id="progress">0 / 0</span></div>
        </div>
        <div class="image-card"><img id="quizImage" alt="題目圖片" /></div>
        <div class="hint-row">
          <button id="hintBtn" class="btn small aqua" type="button">💡 看提示（答對 -5 分）</button>
          <p id="hintText" class="hint-text"></p>
        </div>
        <form id="answerForm" class="answer-row" autocomplete="off">
          <input id="answerInput" type="text" placeholder="輸入你的答案…" />
          <button id="submitBtn" class="btn primary" type="submit">送出</button>
        </form>
        <div id="feedback" class="feedback"></div>
        <button id="nextBtn" class="btn primary full" type="button" hidden>下一題 ▶</button>
      </div>
      <div id="gameEmpty" class="empty-state" hidden>
        <p>題庫目前是空的！請先到「管理題庫」新增題目。</p>
      </div>
      <div id="gameResult" class="result-card" hidden></div>
    </section>

    <!-- ============ 管理題庫 ============ -->
    <section id="view-manage" class="view">
      <div class="toolbar">
        <button class="btn primary" id="addBtn" type="button">➕ 新增題目</button>
        <button class="btn" id="exportBtn" type="button">⬇️ 匯出 JSON</button>
        <button class="btn" id="importBtn" type="button">⬆️ 匯入 JSON</button>
        <button class="btn danger" id="resetBtn" type="button">♻️ 重設預設題庫</button>
        <input type="file" id="importInput" accept=".json,application/json" hidden />
      </div>
      <div id="questionList" class="q-list"></div>
    </section>

    <!-- ============ 多人對戰 ============ -->
    <section id="view-multiplayer" class="view">
      <!-- 大廳 -->
      <div id="lobbyView" class="empty-state">
        <h2 style="margin-top:0;">👥 多人對戰大廳</h2>
        <p>建立房間，或輸入朋友的房間號碼加入！</p>
        <div style="display:flex; gap:10px; justify-content:center; margin-top:15px; flex-wrap:wrap;">
          <button class="btn primary" id="createRoomBtn" type="button">➕ 建立房間</button>
          <button class="btn aqua" id="joinRoomBtn" type="button">🔑 加入房間</button>
        </div>
        <div id="roomInfo" style="margin-top:20px; display:none;">
          <p style="font-size:0.85rem; color:#4E7C88;">房間號碼：</p>
          <h3 id="roomCodeDisplay" style="font-size:2.2rem; letter-spacing:4px; color:#E53935;">----</h3>
          <p id="roomStatus" style="font-weight:900; color:#4E7C88;">等待對手加入中...</p>
          <button class="btn primary" id="startBattleBtn" type="button" style="margin-top:15px; display:none;">🚀 開始對戰</button>
        </div>
      </div>

      <!-- 對戰畫面 -->
      <div id="battleView" hidden>
        <div class="battle-scores">
          <div class="battle-score-box"><div class="name">🧑 你</div><div class="score" id="myBattleScore">0</div></div>
          <div class="battle-score-box"><div class="name">👤 對手</div><div class="score" id="opponentBattleScore">0</div></div>
        </div>
        <div class="battle-status" id="battleStatus">準備開始...</div>
        <div class="timer-bar" id="timerDisplay">⏱ 15 <span>秒</span></div>
        <div class="image-card"><img id="battleImage" alt="題目圖片" /></div>
        <form id="battleAnswerForm" class="answer-row" autocomplete="off">
          <input id="battleAnswerInput" type="text" placeholder="輸入你的答案…" />
          <button id="battleSubmitBtn" class="btn primary" type="submit">送出</button>
        </form>
        <div id="battleFeedback" class="feedback"></div>
        <button id="nextBattleBtn" class="btn primary full" type="button" hidden>下一題 ▶</button>
      </div>

      <!-- 對戰結果 -->
      <div id="battleResult" class="result-card" hidden></div>
    </section>
  </main>
</div>

<!-- ============ 編輯 Modal ============ -->
<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">新增題目</h2>
      <button class="icon-btn" id="closeModalBtn" type="button">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <span class="field-label">題目圖片</span>
        <div class="preview-box" id="previewBox">
          <img id="previewImg" alt="預覽" hidden />
          <span id="previewPlaceholder">尚未選擇圖片</span>
        </div>
        <input type="file" id="fileInput" accept="image/*" />
        <input type="url" id="urlInput" placeholder="或輸入圖片網址 https://…" />
      </div>
      <div class="field">
        <span class="field-label">正確答案（多個用逗號分隔）</span>
        <input type="text" id="answersInput" placeholder="例如：章魚哥, Squidward" />
      </div>
      <div class="field">
        <span class="field-label">提示（選填）</span>
        <input type="text" id="hintInput" placeholder="例如：青色大鼻子" />
      </div>
      <div class="field">
        <span class="field-label">梗圖解說（選填）</span>
        <textarea id="explainInput" rows="3" placeholder="說明這張圖的梗"></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="cancelBtn" type="button">取消</button>
      <button class="btn primary" id="saveBtn" type="button">💾 儲存</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
(function () {
  'use strict';
  const $  = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const uid = () => 'q' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
  function normalize(str) {
    return String(str == null ? '' : str).toLowerCase().replace(/\s+/g, '').replace(/[.,，。！!?？~～、；;：:「」『』()（）\-_/\\]/g, '');
  }
  function checkAnswer(input, answers) {
    const n = normalize(input);
    if (!n) return false;
    return answers.some(a => { const na = normalize(a); return na && (n === na || n.includes(na)); });
  }

  const svgURI  = svg => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  const wrapSvg = inner => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">${inner}</svg>`;
  function starPoints(cx, cy, outer, inner, n = 5) {
    const pts = [];
    for (let i = 0; i < n * 2; i++) {
      const r = i % 2 === 0 ? outer : inner;
      const a = -Math.PI / 2 + (i * Math.PI) / n;
      pts.push((cx + r * Math.cos(a)).toFixed(1) + ',' + (cy + r * Math.sin(a)).toFixed(1));
    }
    return pts.join(' ');
  }

  const DEFAULT_QUESTIONS = [
    { id:'default-1', image:svgURI(wrapSvg('<rect width="400" height="400" fill="#B3E5FC"/><rect x="100" y="55" width="200" height="290" rx="28" fill="#FFF176" stroke="#E8D24B" stroke-width="7"/><ellipse cx="150" cy="115" rx="17" ry="13" fill="#F0DC55"/><ellipse cx="256" cy="100" rx="13" ry="10" fill="#F0DC55"/><ellipse cx="132" cy="235" rx="19" ry="14" fill="#F0DC55"/><ellipse cx="268" cy="250" rx="15" ry="12" fill="#F0DC55"/><ellipse cx="200" cy="308" rx="23" ry="15" fill="#F0DC55"/><circle cx="166" cy="163" r="27" fill="#fff" stroke="#3A3A3A" stroke-width="4"/><circle cx="236" cy="163" r="27" fill="#fff" stroke="#3A3A3A" stroke-width="4"/><circle cx="166" cy="163" r="11" fill="#4FC3F7"/><circle cx="236" cy="163" r="11" fill="#4FC3F7"/><circle cx="166" cy="163" r="5" fill="#111"/><circle cx="236" cy="163" r="5" fill="#111"/><path d="M162 222 q38 36 76 0" fill="#fff" stroke="#3A3A3A" stroke-width="5" stroke-linejoin="round"/>')), answers:['海綿寶寶','海綿','spongebob'], hint:'黃色方形、住在鳳梨屋', explanation:'海綿寶寶是比奇堡的招牌角色。' },
    { id:'default-2', image:svgURI(wrapSvg('<rect width="400" height="400" fill="#B2EBF2"/><polygon points="'+starPoints(200, 205, 158, 76)+'" fill="#FF8A80" stroke="#EF6C5E" stroke-width="6" stroke-linejoin="round"/><ellipse cx="178" cy="155" rx="17" ry="21" fill="#fff" stroke="#3A3A3A" stroke-width="4"/><ellipse cx="222" cy="155" rx="17" ry="21" fill="#fff" stroke="#3A3A3A" stroke-width="4"/><circle cx="178" cy="159" r="8" fill="#111"/><circle cx="222" cy="159" r="8" fill="#111"/><path d="M180 205 q20 22 40 0" fill="none" stroke="#3A3A3A" stroke-width="5" stroke-linecap="round"/>')), answers:['派大星','派翠克','patrick','海星'], hint:'粉紅色的海星', explanation:'派大星住在石頭底下。' },
    { id:'default-3', image:svgURI(wrapSvg('<rect width="400" height="400" fill="#B2EBF2"/><path d="M148 268 q-14 62 2 92" stroke="#79CBC4" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M200 278 q0 60 0 88" stroke="#79CBC4" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M252 268 q14 62 -2 92" stroke="#79CBC4" stroke-width="30" fill="none" stroke-linecap="round"/><ellipse cx="200" cy="175" rx="95" ry="105" fill="#79CBC4" stroke="#4FA8A0" stroke-width="6"/><path d="M200 185 q-18 62 0 78 q18 -16 0 -78 z" fill="#A7E3DD" stroke="#4FA8A0" stroke-width="4"/><ellipse cx="158" cy="148" rx="26" ry="31" fill="#fff" stroke="#3A3A3A" stroke-width="4"/><ellipse cx="242" cy="148" rx="26" ry="31" fill="#fff" stroke="#3A3A3A" stroke-width="4"/><circle cx="158" cy="154" r="10" fill="#111"/><circle cx="242" cy="154" r="10" fill="#111"/><path d="M132 114 q26 -14 52 -2" fill="none" stroke="#3A3A3A" stroke-width="6" stroke-linecap="round"/><path d="M216 112 q26 -12 52 2" fill="none" stroke="#3A3A3A" stroke-width="6" stroke-linecap="round"/><path d="M172 258 q28 16 56 0" fill="none" stroke="#3A3A3A" stroke-width="5" stroke-linecap="round"/>')), answers:['章魚哥','squidward','烏賊'], hint:'青色大鼻子，蟹堡王收銀員', explanation:'章魚哥是海綿寶寶的鄰居兼同事。' },

    { id:'default-6', image:svgURI(wrapSvg('<rect width="400" height="400" fill="#B2EBF2"/><line x1="200" y1="130" x2="200" y2="62" stroke="#558B2F" stroke-width="9" stroke-linecap="round"/><circle cx="200" cy="54" r="13" fill="#8BC34A"/><ellipse cx="200" cy="235" rx="95" ry="105" fill="#8BC34A" stroke="#558B2F" stroke-width="7"/><circle cx="200" cy="198" r="45" fill="#fff" stroke="#33691E" stroke-width="5"/><circle cx="200" cy="198" r="19" fill="#E53935"/><circle cx="200" cy="198" r="9" fill="#111"/><path d="M170 278 q30 22 60 0" fill="none" stroke="#33691E" stroke-width="6" stroke-linecap="round"/>')), answers:['皮老闆','皮老板','plankton','浮游生物'], hint:'綠色的小浮游生物', explanation:'皮老闆一生志業就是偷蟹堡秘方。' }
  ];

  const STORAGE_KEY = 'spongebob_meme_quiz_v1';
  let questions = [];
  let editingId = null;
  let tempImage = '';
  let toastTimer = null;

  function normalizeQuestion(raw) {
    if (!raw || typeof raw !== 'object') return null;
    let image = typeof raw.image === 'string' ? raw.image.trim() : '';
    if (!image) return null;
    let answers = raw.answers;
    if (typeof answers === 'string') answers = answers.split(/[,，、]/);
    if (!Array.isArray(answers)) return null;
    answers = answers.map(a => String(a).trim()).filter(Boolean);
    if (!answers.length) return null;
    return { id: raw.id || uid(), image, answers, hint: raw.hint ? String(raw.hint) : '', explanation: raw.explanation ? String(raw.explanation) : '' };
  }
  function loadQuestions() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) { const data = JSON.parse(raw); if (Array.isArray(data)) { const c = data.map(normalizeQuestion).filter(Boolean); if (c.length) return c; } }
    } catch (e) { console.warn(e); }
    return DEFAULT_QUESTIONS.map(q => ({...q, answers:[...q.answers]}));
  }
  function saveQuestions() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(questions)); return true; }
    catch (e) { toast('⚠️ 儲存失敗！圖片可能太大'); return false; }
  }
  function toast(msg) {
    const el = $('#toast'); el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2300);
  }
  function switchView(name) {
    $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === name));
    $$('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ========== 單人遊戲邏輯 ========== */
  const game = { order: [], idx: 0, score: 0, correctCount: 0, answered: false, hintUsed: false };
  function currentQuestion() { return questions[game.order[game.idx]]; }
  function updateHUD() {
    $('#score').textContent = game.score;
    $('#progress').textContent = game.order.length ? Math.min(game.idx + 1, game.order.length) + ' / ' + game.order.length : '0 / 0';
  }
  function startGame() {
    if (!questions.length) { $('#gamePlay').hidden = true; $('#gameResult').hidden = true; $('#gameEmpty').hidden = false; game.order = []; game.idx = 0; game.score = 0; game.correctCount = 0; updateHUD(); return; }
    $('#gameEmpty').hidden = true; $('#gameResult').hidden = true; $('#gamePlay').hidden = false;
    game.order = questions.map((_, i) => i);
    for (let i = game.order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [game.order[i], game.order[j]] = [game.order[j], game.order[i]]; }
    game.idx = 0; game.score = 0; game.correctCount = 0; renderQuestion();
  }
  function renderQuestion() {
    const q = currentQuestion(); if (!q) { startGame(); return; }
    game.answered = false; game.hintUsed = false;
    $('#quizImage').src = q.image;
    $('#hintText').textContent = ''; $('#hintText').classList.remove('show');
    $('#hintBtn').disabled = false; $('#hintBtn').textContent = '💡 看提示（答對 -5 分）';
    $('#feedback').className = 'feedback'; $('#feedback').innerHTML = '';
    const input = $('#answerInput'); input.value = ''; input.disabled = false;
    $('#submitBtn').disabled = false; $('#nextBtn').hidden = true;
    updateHUD();
    if (window.innerWidth > 760) input.focus();
  }
  function submitAnswer(e) {
    if (e) e.preventDefault(); if (game.answered) return;
    const q = currentQuestion(); if (!q) return;
    const input = $('#answerInput'); const val = input.value;
    if (!val.trim()) { input.focus(); return; }
    game.answered = true;
    const ok = checkAnswer(val, q.answers);
    let gain = 0;
    if (ok) { gain = game.hintUsed ? 5 : 10; game.score += gain; game.correctCount++; }
    input.disabled = true; $('#submitBtn').disabled = true; $('#hintBtn').disabled = true;
    const fb = $('#feedback'); fb.className = 'feedback show ' + (ok ? 'ok' : 'no');
    fb.innerHTML = '<div class="fb-head">' + (ok ? '🎉 答對了！' : '❌ 答錯了') + '</div>' +
      '<div class="fb-line"><span class="tag">標準答案</span>' + escapeHtml(q.answers.join(' / ')) + '</div>' +
      (q.explanation ? '<div class="fb-line"><span class="tag">解說</span>' + escapeHtml(q.explanation) + '</div>' : '') +
      '<div class="fb-gain' + (ok ? '' : ' lose') + '">' + (ok ? '+' + gain + ' 分' : '這題 0 分') + '</div>';
    const next = $('#nextBtn'); next.hidden = false;
    next.textContent = (game.idx + 1 >= game.order.length) ? '🏁 查看結果' : '下一題 ▶';
    updateHUD();
  }
  function nextQuestion() {
    if (game.idx + 1 >= game.order.length) { showResult(); return; }
    game.idx++; renderQuestion();
  }
  function showResult() {
    $('#gamePlay').hidden = true;
    const total = game.order.length; const correct = game.correctCount; const rate = total ? Math.round((correct / total) * 100) : 0;
    let comment = rate === 100 ? '🏆 完美！' : rate >= 80 ? '🌟 太厲害了！' : rate >= 60 ? '👍 不錯喔！' : '😅 別灰心！';
    const box = $('#gameResult');
    box.innerHTML = '<h2 class="result-title">🏁 挑戰完成！</h2><div class="result-score">' + game.score + '<span>分</span></div><p class="result-line">答對 ' + correct + ' / ' + total + ' 題（正確率 ' + rate + '%）</p><p class="result-comment">' + comment + '</p><div class="result-actions"><button class="btn primary" id="replayBtn" type="button">🔁 再玩一次</button></div>';
    box.hidden = false;
    $('#replayBtn').addEventListener('click', startGame);
    updateHUD();
  }

  /* ========== 管理題庫 ========== */
  function renderManageList() {
    const list = $('#questionList');
    if (!questions.length) { list.innerHTML = '<div class="empty-state"><p>題庫是空的，點「➕ 新增題目」開始建立吧！</p></div>'; return; }
    list.innerHTML = questions.map((q, i) => '<div class="q-item"><img src="' + escapeHtml(q.image) + '" alt="" /><div class="q-info"><div class="q-idx">第 ' + (i + 1) + ' 題</div><div class="q-ans">' + escapeHtml(q.answers.join('、')) + '</div>' + (q.hint ? '<div class="q-hint">💡 ' + escapeHtml(q.hint) + '</div>' : '') + '</div><div class="q-actions"><button class="btn small" type="button" data-act="edit" data-id="' + q.id + '">✏️</button><button class="btn small danger" type="button" data-act="del" data-id="' + q.id + '">🗑</button></div></div>').join('');
  }
  function setPreview(src) {
    tempImage = src || '';
    const img = $('#previewImg'); const ph = $('#previewPlaceholder');
    if (tempImage) { img.src = tempImage; img.hidden = false; ph.hidden = true; }
    else { img.hidden = true; img.removeAttribute('src'); ph.hidden = false; }
  }
  function openModal(id) {
    editingId = id || null;
    $('#modalTitle').textContent = id ? '編輯題目' : '新增題目';
    $('#fileInput').value = ''; $('#urlInput').value = ''; $('#answersInput').value = ''; $('#hintInput').value = ''; $('#explainInput').value = '';
    if (id) { const q = questions.find(x => x.id === id); if (q) { setPreview(q.image); $('#answersInput').value = q.answers.join(', '); $('#hintInput').value = q.hint || ''; $('#explainInput').value = q.explanation || ''; } }
    else setPreview('');
    $('#modalBackdrop').hidden = false; document.body.style.overflow = 'hidden';
  }
  function closeModal() { $('#modalBackdrop').hidden = true; document.body.style.overflow = ''; editingId = null; }
  function saveQuestion() {
    const answers = $('#answersInput').value.split(/[,，、]/).map(s => s.trim()).filter(Boolean);
    if (!tempImage) { toast('請先選擇圖片或輸入圖片網址'); return; }
    if (!answers.length) { toast('請至少輸入一個正確答案'); return; }
    const data = { id: editingId || uid(), image: tempImage, answers, hint: $('#hintInput').value.trim(), explanation: $('#explainInput').value.trim() };
    if (editingId) { const i = questions.findIndex(q => q.id === editingId); if (i > -1) questions[i] = data; else questions.push(data); }
    else questions.push(data);
    saveQuestions(); renderManageList(); closeModal(); toast(editingId ? '✅ 題目已更新！' : '✅ 題目已新增！'); startGame();
  }
  function exportJSON() {
    if (!questions.length) { toast('題庫是空的'); return; }
    const blob = new Blob([JSON.stringify(questions, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href = url; a.download = 'spongebob-quiz.json'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000); toast('📦 已匯出 ' + questions.length + ' 題');
  }
  function importJSON(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data)) throw new Error('格式錯誤');
        const cleaned = data.map(normalizeQuestion).filter(Boolean);
        if (!cleaned.length) throw new Error('找不到有效題目');
        if (!confirm('即將匯入 ' + cleaned.length + ' 題，並覆蓋目前的題庫，確定嗎？')) return;
        questions = cleaned; saveQuestions(); renderManageList(); startGame(); toast('📥 匯入成功！');
      } catch (e) { alert('匯入失敗：' + e.message); }
    };
    reader.readAsText(file);
  }
  function resetBank() {
    if (!confirm('確定要重設為預設題庫嗎？')) return;
    questions = DEFAULT_QUESTIONS.map(q => ({...q, answers:[...q.answers]}));
    saveQuestions(); renderManageList(); startGame(); toast('♻️ 已重設');
  }

  /* ========== 事件綁定 ========== */
  function bindEvents() {
    $$('.tab').forEach(tab => tab.addEventListener('click', () => switchView(tab.dataset.view)));
    $('#answerForm').addEventListener('submit', submitAnswer);
    $('#nextBtn').addEventListener('click', nextQuestion);
    $('#hintBtn').addEventListener('click', () => {
      if (game.answered) return;
      const q = currentQuestion(); if (!q) return;
      game.hintUsed = true;
      $('#hintText').textContent = q.hint ? '💡 ' + q.hint : '這題沒有提示啦 QQ';
      $('#hintText').classList.add('show');
      $('#hintBtn').disabled = true; $('#hintBtn').textContent = '💡 提示已使用（答對 -5 分）';
    });
    $('#addBtn').addEventListener('click', () => openModal(null));
    $('#exportBtn').addEventListener('click', exportJSON);
    $('#resetBtn').addEventListener('click', resetBank);
    $('#importBtn').addEventListener('click', () => $('#importInput').click());
    $('#importInput').addEventListener('change', e => { const f = e.target.files[0]; if (f) importJSON(f); e.target.value = ''; });
    $('#questionList').addEventListener('click', e => {
      const btn = e.target.closest('button[data-act]'); if (!btn) return;
      const id = btn.dataset.id;
      if (btn.dataset.act === 'edit') openModal(id);
      if (btn.dataset.act === 'del') {
        if (!confirm('確定要刪除嗎？')) return;
        questions = questions.filter(x => x.id !== id); saveQuestions(); renderManageList(); startGame(); toast('🗑 已刪除');
      }
    });
    $('#closeModalBtn').addEventListener('click', closeModal);
    $('#cancelBtn').addEventListener('click', closeModal);
    $('#saveBtn').addEventListener('click', saveQuestion);
    $('#modalBackdrop').addEventListener('click', e => { if (e.target === $('#modalBackdrop')) closeModal(); });
    $('#fileInput').addEventListener('change', e => {
      const file = e.target.files[0]; if (!file || !file.type.startsWith('image/')) { toast('請選擇圖片'); return; }
      const reader = new FileReader();
      reader.onload = ev => { setPreview(ev.target.result); $('#urlInput').value = ''; };
      reader.readAsDataURL(file);
    });
    $('#urlInput').addEventListener('input', e => {
      const v = e.target.value.trim();
      if (v) { $('#fileInput').value = ''; setPreview(v); } else setPreview('');
    });
  }

  function init() {
    questions = loadQuestions(); renderManageList(); bindEvents(); startGame();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>

     Firebase 多人同步競爭邏輯

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, set, get, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD1wowbwxt56vCI5jwfV7jmqYgnB9mdzr4",
    authDomain: "spongebob-battl.firebaseapp.com",
    databaseURL: "https://spongebob-battl-default-rtdb.firebaseio.com",
    projectId: "spongebob-battl",
    storageBucket: "spongebob-battl.firebasestorage.app",
    messagingSenderId: "863029367726",
    appId: "1:863029367726:web:37e6c3555f3f153998ee3f"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // 從主腳本拿題庫
  const getQuestions = () => {
    try { return JSON.parse(localStorage.getItem('spongebob_meme_quiz_v1')) || []; } catch(e) { return []; }
  };

  const $ = sel => document.querySelector(sel);
  const lobbyView = $('#lobbyView');
  const battleView = $('#battleView');
  const battleResult = $('#battleResult');
  const roomInfo = $('#roomInfo');
  const roomCodeDisplay = $('#roomCodeDisplay');
  const roomStatus = $('#roomStatus');
  const createRoomBtn = $('#createRoomBtn');
  const joinRoomBtn = $('#joinRoomBtn');
  const startBattleBtn = $('#startBattleBtn');
  const battleImage = $('#battleImage');
  const battleAnswerInput = $('#battleAnswerInput');
  const battleSubmitBtn = $('#battleSubmitBtn');
  const battleAnswerForm = $('#battleAnswerForm');
  const battleFeedback = $('#battleFeedback');
  const nextBattleBtn = $('#nextBattleBtn');
  const timerDisplay = $('#timerDisplay');
  const battleStatus = $('#battleStatus');
  const myBattleScore = $('#myBattleScore');
  const opponentBattleScore = $('#opponentBattleScore');

  let currentRoomCode = null;
  let currentRole = null; // 'host' or 'guest'
  let roomListener = null;
  let timerInterval = null;
  let currentQuestionIndex = -1;
  let currentQuestionData = null;
  let hasAnsweredThisRound = false;
  let battleQuestions = [];

  function generateRoomCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = ''; for (let i = 0; i < 5; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
    return code;
  }

  // 建立房間
  createRoomBtn.addEventListener('click', async () => {
    const code = generateRoomCode();
    const roomRef = ref(db, 'rooms/' + code);
    try {
      await set(roomRef, {
        createdAt: Date.now(),
        status: 'waiting',
        currentQuestion: 0,
        questionStartTime: 0,
        players: { host: { joinedAt: Date.now(), score: 0, answered: false } }
      });
      currentRoomCode = code;
      currentRole = 'host';
      roomCodeDisplay.textContent = code;
      roomInfo.style.display = 'block';
      createRoomBtn.disabled = true;
      joinRoomBtn.disabled = true;
      roomStatus.textContent = '等待對手加入中...';
      startBattleBtn.style.display = 'none';
      listenToRoom(roomRef);
    } catch (err) { alert('建立房間失敗：' + err.message); }
  });

  // 加入房間
  joinRoomBtn.addEventListener('click', async () => {
    const code = prompt('請輸入 5 位數房間號碼：');
    if (!code) return;
    const upperCode = code.toUpperCase();
    const roomRef = ref(db, 'rooms/' + upperCode);
    try {
      const snapshot = await get(roomRef);
      if (!snapshot.exists()) { alert('找不到這個房間'); return; }
      const data = snapshot.val();
      if (data.players && Object.keys(data.players).length >= 2) { alert('房間已滿'); return; }
      await update(ref(db, 'rooms/' + upperCode + '/players'), {
        guest: { joinedAt: Date.now(), score: 0, answered: false }
      });
      currentRoomCode = upperCode;
      currentRole = 'guest';
      roomCodeDisplay.textContent = upperCode;
      roomInfo.style.display = 'block';
      roomStatus.textContent = '✅ 成功加入！等待房主開始...';
      createRoomBtn.disabled = true;
      joinRoomBtn.disabled = true;
      startBattleBtn.style.display = 'none';
      listenToRoom(roomRef);
    } catch (err) { alert('加入房間失敗：' + err.message); }
  });

  // 監聽房間狀態
  function listenToRoom(roomRef) {
    if (roomListener) roomListener();
    roomListener = onValue(roomRef, (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      // 更新大廳狀態
      if (data.status === 'waiting') {
        const count = data.players ? Object.keys(data.players).length : 0;
        if (count >= 2) {
          roomStatus.textContent = '✅ 對手已加入！可以開始對戰了！';
          if (currentRole === 'host') startBattleBtn.style.display = 'inline-block';
        } else {
          roomStatus.textContent = '等待對手加入中...';
          startBattleBtn.style.display = 'none';
        }
        lobbyView.hidden = false;
        battleView.hidden = true;
        battleResult.hidden = true;
      }

      // 遊戲開始
      if (data.status === 'playing') {
        lobbyView.hidden = true;
        battleView.hidden = false;
        battleResult.hidden = true;

        // 更新分數
        if (data.players) {
          myBattleScore.textContent = data.players[currentRole] ? data.players[currentRole].score : 0;
          const oppRole = currentRole === 'host' ? 'guest' : 'host';
          opponentBattleScore.textContent = data.players[oppRole] ? data.players[oppRole].score : 0;
        }

        // 題目切換
        if (data.currentQuestion !== currentQuestionIndex && data.currentQuestion < battleQuestions.length) {
          currentQuestionIndex = data.currentQuestion;
          currentQuestionData = battleQuestions[currentQuestionIndex];
          if (!currentQuestionData) return;

          // 重置答題狀態
          hasAnsweredThisRound = false;
          battleAnswerInput.value = '';
          battleAnswerInput.disabled = false;
          battleSubmitBtn.disabled = false;
          battleFeedback.className = 'feedback';
          battleFeedback.innerHTML = '';
          nextBattleBtn.hidden = true;

          // 顯示題目
          battleImage.src = currentQuestionData.image;
          battleStatus.textContent = '第 ' + (currentQuestionIndex + 1) + ' / ' + battleQuestions.length + ' 題';
          timerDisplay.textContent = '⏱ 15 秒';

          // 清除舊的計時器
          if (timerInterval) clearInterval(timerInterval);

          // 倒數計時
          const startTime = data.questionStartTime || Date.now();
          const endTime = startTime + 15000;
          timerInterval = setInterval(() => {
            const now = Date.now();
            const left = Math.max(0, Math.ceil((endTime - now) / 1000));
            timerDisplay.innerHTML = '⏱ ' + left + ' <span>秒</span>';
            if (left <= 0) {
              clearInterval(timerInterval);
              timerDisplay.textContent = '⏱ 時間到！';
              battleAnswerInput.disabled = true;
              battleSubmitBtn.disabled = true;
            }
          }, 200);
        }

        // 如果時間到，顯示答案
        if (data.status === 'showing_answer') {
          if (timerInterval) clearInterval(timerInterval);
          timerDisplay.textContent = '⏱ 時間到！';
          battleAnswerInput.disabled = true;
          battleSubmitBtn.disabled = true;
          if (currentQuestionData) {
            battleFeedback.className = 'feedback show ok';
            battleFeedback.innerHTML = '<div class="fb-head">📢 正確答案</div><div class="fb-line">' + currentQuestionData.answers.join(' / ') + '</div>' + (currentQuestionData.explanation ? '<div class="fb-line"><span class="tag">解說</span>' + currentQuestionData.explanation + '</div>' : '');
          }
          if (currentRole === 'host') {
            nextBattleBtn.hidden = false;
            nextBattleBtn.textContent = (currentQuestionIndex + 1 >= battleQuestions.length) ? '🏁 查看結果' : '下一題 ▶';
          }
        }

        // 遊戲結束
        if (data.status === 'finished') {
          if (timerInterval) clearInterval(timerInterval);
          lobbyView.hidden = true;
          battleView.hidden = true;
          battleResult.hidden = false;
          const myScore = data.players[currentRole] ? data.players[currentRole].score : 0;
          const oppRole = currentRole === 'host' ? 'guest' : 'host';
          const oppScore = data.players[oppRole] ? data.players[oppRole].score : 0;
          let resultText = myScore > oppScore ? '🏆 你贏了！' : myScore < oppScore ? '😢 你輸了...' : '🤝 平手！';
          battleResult.innerHTML = '<h2 class="result-title">🏁 對戰結束</h2><div class="result-score">' + myScore + '<span>分</span></div><p class="result-line">對手：' + oppScore + ' 分</p><p class="result-comment">' + resultText + '</p><div class="result-actions"><button class="btn primary" id="backToLobbyBtn" type="button">🔁 回到大廳</button></div>';
          $('#backToLobbyBtn').addEventListener('click', () => {
            // 清理並重新載入
            if (roomListener) roomListener();
            if (timerInterval) clearInterval(timerInterval);
            lobbyView.hidden = false; battleView.hidden = true; battleResult.hidden = true;
            createRoomBtn.disabled = false; joinRoomBtn.disabled = false;
            roomInfo.style.display = 'none'; startBattleBtn.style.display = 'none';
            currentRoomCode = null; currentRole = null; currentQuestionIndex = -1;
            // 刪除房間
            if (currentRoomCode) remove(ref(db, 'rooms/' + currentRoomCode));
          });
        }
      }
    });
  }

  // 開始對戰（房主）
  startBattleBtn.addEventListener('click', async () => {
    if (!currentRoomCode || currentRole !== 'host') return;
    battleQuestions = getQuestions();
    if (!battleQuestions.length) { alert('題庫是空的！請先到「管理題庫」新增題目。'); return; }
    // 洗牌
    for (let i = battleQuestions.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [battleQuestions[i], battleQuestions[j]] = [battleQuestions[j], battleQuestions[i]];
    }
    await update(ref(db, 'rooms/' + currentRoomCode), {
      status: 'playing',
      currentQuestion: 0,
      questionStartTime: Date.now() + 3000 // 3 秒後開始
    });
  });

  // 提交答案
  battleAnswerForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!currentRoomCode || hasAnsweredThisRound || battleAnswerInput.disabled) return;
    const val = battleAnswerInput.value.trim();
    if (!val) return;
    hasAnsweredThisRound = true;
    battleAnswerInput.disabled = true;
    battleSubmitBtn.disabled = true;

    // 檢查答案
    const ok = checkAnswer(val, currentQuestionData.answers);
    if (ok) {
      const myScoreRef = ref(db, 'rooms/' + currentRoomCode + '/players/' + currentRole + '/score');
      // 用 transaction 避免競爭條件（簡化起見，直接讀取後更新）
      const snapshot = await get(myScoreRef);
      const currentScore = snapshot.val() || 0;
      await update(ref(db, 'rooms/' + currentRoomCode + '/players/' + currentRole), {
        score: currentScore + 10,
        answered: true
      });
      battleFeedback.className = 'feedback show ok';
      battleFeedback.innerHTML = '<div class="fb-head">🎉 答對了！+10 分</div>';
    } else {
      battleFeedback.className = 'feedback show no';
      battleFeedback.innerHTML = '<div class="fb-head">❌ 答錯了</div>';
    }

    // 檢查雙方是否都答題了
    const roomSnapshot = await get(ref(db, 'rooms/' + currentRoomCode + '/players'));
    const players = roomSnapshot.val();
    const allAnswered = Object.values(players).every(p => p.answered);
    if (allAnswered && currentRole === 'host') {
      // 雙方都答題，提前結束本回合
      await update(ref(db, 'rooms/' + currentRoomCode), { status: 'showing_answer' });
    }
  });

  // 下一題（房主）
  nextBattleBtn.addEventListener('click', async () => {
    if (!currentRoomCode || currentRole !== 'host') return;
    const nextIdx = currentQuestionIndex + 1;
    if (nextIdx >= battleQuestions.length) {
      await update(ref(db, 'rooms/' + currentRoomCode), { status: 'finished' });
    } else {
      // 重置雙方答題狀態
      const updates = {};
      updates['rooms/' + currentRoomCode + '/status'] = 'playing';
      updates['rooms/' + currentRoomCode + '/currentQuestion'] = nextIdx;
      updates['rooms/' + currentRoomCode + '/questionStartTime'] = Date.now() + 3000;
      updates['rooms/' + currentRoomCode + '/players/host/answered'] = false;
      updates['rooms/' + currentRoomCode + '/players/guest/answered'] = false;
      await update(ref(db), updates);
    }
  });

  // 答案比對函式（與主腳本相同邏輯）
  function normalize(str) {
    return String(str == null ? '' : str).toLowerCase().replace(/\s+/g, '').replace(/[.,，。！!?？~～、；;：:「」『』()（）\-_/\\]/g, '');
  }
  function checkAnswer(input, answers) {
    const n = normalize(input);
    if (!n) return false;
    return answers.some(a => { const na = normalize(a); return na && (n === na || n.includes(na)); });
  }

})();
</script>
